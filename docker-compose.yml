services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=gemini
      - LLM_API_KEY=${LLM_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
      - DEBUG=false
    restart: unless-stopped
